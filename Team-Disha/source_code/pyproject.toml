[project]
name = "clickathon"
version = "0.1.0"
description = "Automated root-cause analyst for Click-a-thon 2026 (InMobi track)"
readme = "README.md"
authors = [
    { name = "AshiqAbdulkhader", email = "ashiqabdulkhader@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=1.6.0",
    "httpx>=0.28.1",
    "langfuse>=4.14.2",
    "matplotlib>=3.10.0",
    "mcp[cli]>=1.9.0",
    "openai>=2.52.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.scripts]
clickathon = "clickathon:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
